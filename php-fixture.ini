[PHP]
; ---- Fixture‑optimized CLI configuration ----
; All changes marked with "***" differ from original file

; --- Core --------------------------------------------------
engine                         = On
short_open_tag                 = Off
precision                      = 14
output_buffering               = 4096
zlib.output_compression        = Off
implicit_flush                 = Off
serialize_precision            = -1
zend.enable_gc                 = On
expose_php                     = Off          ; *** hide PHP signature, micro‑cost

; --- Limits ------------------------------------------------
max_execution_time             = 0            ; *** unlimited for CLI jobs
max_input_time                 = 60
memory_limit                   = -1

; --- Error handling ---------------------------------------
error_reporting                = E_ALL
; Turn off display for tiny perf gain & cleaner output
zend.assertions                = -1           ; *** remove opcodes

; display_* disabled → no HTML renderer triggered
display_errors                 = Off          ; ***
display_startup_errors         = Off          ; ***
html_errors                    = Off          ; ***
log_errors                     = On
log_errors_max_len             = 1024

; --- Input / variables ------------------------------------
variables_order                = "GPCS"
request_order                  = "GP"
register_argc_argv             = Off
auto_globals_jit               = On
post_max_size                  = 8M

; --- Paths / realpath cache -------------------------------
realpath_cache_ttl             = 3600          ; *** as per Blackfire rec
realpath_cache_size            = 4096k         ; *** ~4MB

; --- Opcache  ---------------------------------------
opcache.enable_cli             = 1             ; *** cache PHP code between runs
opcache.enable_file_override   = 1             ; *** speeds classmap include
opcache.revalidate_freq        = 0
opcache.memory_consumption     = 128

; --- Networking / mail ------------------------------------
allow_url_fopen                = On
allow_url_include              = Off
cli_server.color               = On

SMTP                           = localhost
smtp_port                      = 25
mail.add_x_header              = Off           ; *** not needed in fixtures

; --- PDO / MySQL ------------------------------------------
pdo_mysql.cache_size           = 2000
mysqlnd.collect_statistics     = Off           ; *** disable debug stats
mysqlnd.collect_memory_statistics = Off        ; ***

; --- Sessions (unused in fixtures, kept minimal) ----------
session.save_handler           = files
session.use_strict_mode        = 0
session.gc_probability         = 0             ; *** avoid GC hit
